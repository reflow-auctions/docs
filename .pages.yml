# Pages CMS config — https://pagescms.org/docs/configuration/
# Editors sign in at https://app.pagescms.org and pick reflow-auctions/docs.
# Every save is a commit to main; GitHub Actions then rebuilds the site (~2 min).

media:
  input: static/img/docs
  output: /img/docs
  categories: [image]
  rename: safe

settings:
  content:
    # Keep front matter keys this form doesn't show (e.g. sidebar_label).
    merge: true

content:
  - name: docs
    label: Docs
    type: collection
    path: docs
    subfolders: true
    # Name new pages after their title (e.g. "Bulk Actions" -> bulk-actions.md),
    # never a date prefix: the file name is the page's URL.
    filename:
      template: "{primary}.md"
      field: create
    view:
      layout: tree
      fields: [title]
      primary: title
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: description
        label: Short description (shown in search results)
        type: text
      - name: body
        label: Page content
        type: rich-text
        options:
          format: markdown
          switcher: true

  - name: releases
    label: Releases
    type: collection
    path: releases
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, date]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Version (e.g. v1.54.0) — the file name must match, e.g. v1.54.0.md
        type: string
        required: true
        pattern:
          regex: "^v\\d+\\.\\d+\\.\\d+$"
          message: "Use the format v1.54.0"
      - name: date
        label: Release date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: body
        label: Release notes (use the headings Features / Improvements / Fixes)
        type: rich-text
        options:
          format: markdown
          switcher: true

  # Drag sections and the pages inside them to reorder the sidebar.
  # Pages can't move to another section here (the folder is part of the URL).
  - name: sidebar
    label: Sidebar order
    type: file
    path: sidebar.yml
    format: yaml
    list: true
    fields:
      - name: section
        label: Folder (don't change)
        type: string
        required: true
      - name: label
        label: Section heading
        type: string
        required: true
      - name: pages
        label: Pages, in order (file name without .md)
        type: string
        list: true

